# Génère le projet Xcode avec XcodeGen :  brew install xcodegen && xcodegen
name: Duo
options:
  bundleIdPrefix: com.tskapo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Duo:
    type: application
    platform: iOS
    sources: [Duo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tskapo.duo   # doit être unique pour ton compte Apple
        DEVELOPMENT_TEAM: ""                        # ou choisis l'équipe dans Xcode > Signing
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Duo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Pour prendre des photos à envoyer à Claude."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pour la dictée et le mode vocal de Claude."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pour joindre des images à tes conversations."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Pour enregistrer des images depuis Claude."
